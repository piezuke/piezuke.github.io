<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <base href="/" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self' 'sha256-FkTHWBuT3P7TYucOCTtOuYrtDFD1HBYVnS/O1uBg9P4='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https://api.github.com; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"
        />
        <meta
            name="format-detection"
            content="telephone=no, email=no, address=no"
        />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="referrer" content="strict-origin-when-cross-origin" />
        <meta name="theme-color" content="#050505" />
        <meta name="color-scheme" content="light dark" />
        <meta name="darkreader-lock" />
        <meta name="supported-color-schemes" content="light dark" />
        <script>
            if (window.top !== window.self) {
                try {
                    window.top.location = window.self.location;
                } catch (e) {}
            }
            try {
                var saved = localStorage.getItem("theme");
                var theme =
                    saved === "light" || saved === "dark"
                        ? saved
                        : window.matchMedia &&
                            window.matchMedia("(prefers-color-scheme: light)")
                                .matches
                          ? "light"
                          : "dark";
                var root = document.documentElement;
                root.setAttribute("data-theme", theme);
                root.style.colorScheme = theme;
                var tc = document.querySelector('meta[name="theme-color"]');
                if (tc)
                    tc.setAttribute(
                        "content",
                        theme === "light" ? "#f6f6f6" : "#050505",
                    );
            } catch (e) {}
        </script>
        <title>piezuke — pieBlog</title>
        <meta
            name="google-site-verification"
            content="CVrKIcMRcnF7B9URy3kxmeR67QlqD2BEN9DEisY5zEs"
        />
        <meta
            name="description"
            content="piezuke's blog — CS projects, CTF writeups, notes, and whatever else I'm tinkering with."
        />
        <meta property="og:title" content="piezuke — pieBlog" />
        <meta
            property="og:description"
            content="piezuke's blog — CS projects, CTF writeups, notes, and whatever else I'm tinkering with."
        />
        <meta property="og:type" content="website" />
        <meta property="og:image" content="media/pfp.jpg" />
        <meta name="twitter:card" content="summary" />
        <link rel="icon" href="media/pfp.webp" />
        <link
            rel="preload"
            as="image"
            href="media/pfp.webp"
            type="image/webp"
            fetchpriority="high"
        />
        <link
            rel="preload"
            as="font"
            href="fonts/jetbrains-mono-latin-400-normal.woff2"
            type="font/woff2"
            crossorigin
        />
        <link
            rel="preload"
            as="font"
            href="fonts/jersey-25-latin-400-normal.woff2"
            type="font/woff2"
            crossorigin
        />
        <link rel="stylesheet" href="fonts.css" />
        <link rel="stylesheet" href="style.css" />
        <noscript><style>#loader{display:none}</style></noscript>
        <!-- seo:feed --><link rel="alternate" type="application/rss+xml" title="piezuke" href="feed.xml" /><!-- /seo:feed -->
    </head>
    <body>
        <a class="skip-link" href="#app" data-cfg="ui.a11y.skipLink">Skip to content</a>
        <div id="sr-announcer" class="sr-only" role="status" aria-live="polite"></div>
        <canvas id="bgcanvas" aria-hidden="true"></canvas>
        <div id="progress"></div>

        <div id="loader" role="status" aria-live="polite">
            <span class="sr-only" data-cfg="ui.a11y.loading">Loading</span>
            <div style="width: 320px; max-width: 80vw">
                <video
                    id="loader-video"
                    loop
                    muted
                    playsinline
                    preload="metadata"
                    style="width: 100%; border-radius: 8px"
                    src="media/loader.mp4"
                ></video>
            </div>
            <div class="loadbarwrap"><div class="loadbar"></div></div>
            <div
                class="loadertext" aria-hidden="true"
                id="loaderlabel"
                data-cfg="ui.loader.initial"
            >
                CONNECTING...
            </div>
        </div>

        <header class="topnav">
            <a
                href="/"
                class="brand"
                aria-label="Home"
                data-cfg-href="home"
                data-cfg-attr="aria-label:nav.homeLabel"
            >
                <span id="cfg-brand">PIE</span>
            </a>
            <nav class="links" id="navlinks" aria-label="Primary" data-cfg-attr="aria-label:ui.a11y.navLabel"></nav>
            <div class="navctl">
                <div
                    id="cmdk-btn"
                    role="button"
                    tabindex="0"
                    title="Command palette (Ctrl/⌘ K)"
                    aria-label="Search everything"
                    data-cfg-attr="title:ui.search.buttonTitle;aria-label:ui.search.buttonLabel"
                >
                    <span
                        ><span class="cmdk-key" data-cfg="ui.search.key"
                            >⌘</span
                        >
                        <span class="cmdk-text" data-cfg="ui.search.buttonText"
                            >search everything</span
                        ></span
                    >
                </div>
                <div
                    class="mini-player"
                    id="mini-player"
                    role="region"
                    aria-label="Audio player"
                    data-cfg-attr="aria-label:ui.miniPlayer.label"
                >
                    <div class="mini-player-body">
                        <a
                            href="/about"
                            class="mini-art"
                            title="View in playlist"
                            data-cfg-href="about"
                            data-cfg-attr="title:ui.miniPlayer.linkTitle"
                        >
                            <svg
                                class="mini-art-icon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                            >
                                <circle cx="12" cy="12" r="10"></circle>
                                <circle cx="12" cy="12" r="3"></circle>
                                <line x1="12" y1="2" x2="12" y2="5"></line>
                                <line x1="12" y1="19" x2="12" y2="22"></line>
                            </svg>
                        </a>
                        <a
                            href="/about"
                            class="mini-info"
                            title="View in playlist"
                            data-cfg-href="about"
                            data-cfg-attr="title:ui.miniPlayer.linkTitle"
                        >
                            <div
                                class="mini-title"
                                id="mini-title"
                                data-cfg="ui.miniPlayer.idleTitle"
                            >
                                Track 01
                            </div>
                            <div class="mini-meta">
                                <span class="mini-led"></span>
                                <span
                                    class="mini-status"
                                    id="mini-status"
                                    data-cfg="music.status.idle"
                                    >IDLE</span
                                >
                            </div>
                        </a>
                        <div class="mini-actions">
                            <button
                                class="mini-btn mini-play"
                                id="mini-play-btn"
                                title="Play / Pause"
                                aria-label="Play or pause audio"
                                data-cfg-attr="title:ui.miniPlayer.playTitle;aria-label:ui.miniPlayer.playLabel"
                            >
                                <svg
                                    class="mini-play-ic"
                                    id="mini-play-ic"
                                    viewBox="0 0 24 24"
                                    width="13"
                                    height="13"
                                    fill="currentColor"
                                >
                                    <path d="M8 5v14l11-7z" />
                                </svg>
                                <svg
                                    class="mini-pause-ic"
                                    id="mini-pause-ic"
                                    viewBox="0 0 24 24"
                                    width="13"
                                    height="13"
                                    fill="currentColor"
                                    style="display: none"
                                >
                                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                                </svg>
                            </button>
                            <button
                                class="mini-btn"
                                id="mini-next-btn"
                                title="Skip to next track"
                                aria-label="Skip to next track"
                                data-cfg-attr="title:ui.miniPlayer.nextTitle;aria-label:ui.miniPlayer.nextLabel"
                            >
                                <svg
                                    viewBox="0 0 24 24"
                                    width="14"
                                    height="14"
                                    fill="currentColor"
                                >
                                    <path
                                        d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"
                                    />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="mini-progress-track">
                        <div
                            class="mini-progress-fill"
                            id="mini-progress-fill"
                        ></div>
                    </div>
                </div>
                <button
                    class="ibtn burger"
                    id="burgerbtn"
                    title="Menu"
                    aria-label="Toggle navigation menu"
                    data-cfg-attr="title:nav.menuTitle;aria-label:nav.menuLabel"
                    aria-expanded="false"
                    aria-controls="navlinks"
                >
                    ≡
                </button>
            </div>
        </header>

        <main id="app" tabindex="-1"></main>
        <footer class="global-footer">
            <div class="wrap footer-inner">
                <div class="footer-main">
                    <div class="footer-cta" id="footer-cta"></div>
                    <div class="footer-cols" id="footer-cols"></div>
                </div>
                <div class="footer-bar">
                    <p class="footer-copy" id="cfg-footer-text"></p>
                    <p class="footer-quip" id="cfg-footer-quip"></p>
                </div>
            </div>
        </footer>

        <aside class="bottom-left-controls" aria-label="Page controls" data-cfg-attr="aria-label:ui.a11y.controls">
            <button
                id="themebtn"
                class="theme-switch"
                type="button"
                role="switch"
                aria-checked="true"
                aria-label="Dark mode"
                title="Toggle theme"
                data-cfg-attr="aria-label:ui.theme.label"
            ></button>
        </aside>
        <audio id="global-player-audio" preload="metadata"></audio>
        <button
            id="btt-btn"
            class="btt-btn"
            title="Back to top"
            aria-label="Scroll to top or bottom"
            data-cfg-attr="title:ui.backToTop.top;aria-label:ui.backToTop.label"
        >
            <img
                src="media/top_light.webp"
                id="btt-img"
                width="60"
                height="60"
                alt=""
            />
        </button>

        <div id="palette-overlay">
            <div
                id="palette"
                role="dialog"
                aria-label="Command palette"
                data-cfg-attr="aria-label:ui.search.dialogLabel"
            >
                <input
                    id="palette-input"
                    type="text"
                    placeholder="Search writeups, projects, notes..."
                    data-cfg-attr="placeholder:ui.search.placeholder"
                    autocomplete="off"
                    spellcheck="false"
                />
                <div id="palette-results"></div>
                <div class="palette-hint">
                    <span
                        ><kbd><span class="sysarrows">↑↓</span></kbd>
                        <span data-cfg="ui.search.hintNavigate">navigate</span>
                        &nbsp; <kbd>↵</kbd>
                        <span data-cfg="ui.search.hintOpen">open</span></span
                    ><span
                        ><kbd>esc</kbd>
                        <span data-cfg="ui.search.hintClose">close</span></span
                    >
                </div>
            </div>
        </div>

        <script defer src="marked.min.js"></script>
        <script defer src="config.js"></script>
        <script defer src="js/configcheck.js"></script>
        <script defer src="js/cursor.js"></script>
        <script defer src="data.js"></script>
        <script defer src="js/player.js"></script>
        <script defer src="js/canvas.js"></script>
        <script defer src="js/highlight.js"></script>
        <script defer src="js/app.js"></script>
        <script defer src="js/cmdk.js"></script>
        <script defer src="js/gsap.min.js"></script>
        <script defer src="js/ScrollTrigger.min.js"></script>
        <script defer src="js/SplitText.min.js"></script>
        <script defer src="js/fx.js"></script>
    </body>
</html>
