<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-OpGppN9J4MD3m172J+DsFV3/hQXYmKYKfwx0VuC0SNU='; base-uri 'none'; form-action 'none';" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="darkreader-lock" />
    <title>404 — Redirecting</title>
    <script>
      (function () {
        try {
          sessionStorage.setItem(
            "spa_redirect",
            location.pathname + location.search + location.hash
          );
        } catch (e) {}
        location.replace("/");
      })();
    </script>
    <style>
      :root { --bg: #050505; --fg: #fafafa; --dim: #a6a6a6; color-scheme: dark light; }
      @media (prefers-color-scheme: light) {
        :root { --bg: #f6f6f6; --fg: #050505; --dim: #4d4d4d; }
      }
    </style>
  </head>
  <body style="background:var(--bg);color:var(--fg);font-family:ui-monospace,monospace;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;">
    <div>
      <h1 style="font-size:36px;margin:0 0 10px">404</h1>
      <p style="color:var(--dim);font-size:16px">
        Redirecting to <a href="/" style="color:var(--fg);text-decoration:underline">home</a>...
      </p>
    </div>
  </body>
</html>
