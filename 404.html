<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>404 — Redirecting</title>
        <meta http-equiv="refresh" content="1; url=./#/" />
        <script>
            (function () {
                var loc = window.location;
                var parts = loc.pathname.split("/").filter(Boolean);
                var routeNames = new Set([
                    "writeups",
                    "projects",
                    "notes",
                    "story",
                    "timeline",
                    "me",
                    "about",
                ]);
                var routeStart = parts.findIndex((part) => routeNames.has(part));
                var baseParts = [];
                var routeParts = [];
                if (routeStart >= 0) {
                    baseParts = parts.slice(0, routeStart);
                    routeParts = parts.slice(routeStart);
                } else if (
                    parts.length &&
                    !parts[parts.length - 1].endsWith(".html")
                ) {
                    baseParts = parts.slice(0, 1);
                    routeParts = parts.slice(1);
                } else if (parts.length > 1) {
                    baseParts = parts.slice(0, -1);
                }
                var base = baseParts.length
                    ? "/" + baseParts.join("/") + "/"
                    : "/";
                var target = base + "#/" + routeParts.join("/");
                loc.replace(target);
            })();
        </script>
    </head>
    <body
        style="
            background: #050505;
            color: #f2f2f2;
            font-family: ui-monospace, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        "
    >
        <div>
            <h1 style="font-size: 36px; margin: 0 0 10px">404</h1>
            <p style="color: #8a8a8a; font-size: 16px">
                Page not found. Redirecting to
                <a
                    href="./#/"
                    style="color: #f2f2f2; text-decoration: underline"
                    >home</a
                >...
            </p>
        </div>
    </body>
</html>
