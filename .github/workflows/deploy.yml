name: Test & deploy

# Setup (once): repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Then every push to main runs the tests, rebuilds data.js / per-post pages / sitemap / feed
# from content/, minifies + fingerprints the site (node build.js) and publishes ONLY the
# built site files (never content/ or manage.js - so unpublished drafts are not put on the website).
#
# Security notes
#  - every action is pinned to a commit SHA (the comment shows the tag it came from), so a moved
#    or hijacked tag cannot change what runs here. Dependabot (see ../dependabot.yml) proposes updates.
#  - each job gets only the permissions it needs; the test job cannot publish anything.
#  - `npm ci --ignore-scripts`: dependencies are installed without running their install scripts.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# let a running deployment finish; newer pushes queue behind it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Build content (data.js, per-post pages, sitemap.xml, feed.xml)
        run: |
          # Safety: only rebuild data.js from content/ when content/ actually has posts,
          # so a repo that keeps its posts in data.js is never wiped by a deploy.
          if find content -name '*.md' 2>/dev/null | grep -q .; then
            node manage.js sync
          else
            echo "content/ has no .md files - keeping the committed data.js"
            node manage.js seo
          fi

      - name: Build the site (copy, minify, fingerprint, service worker)
        run: node build.js --out dist

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
